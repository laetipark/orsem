name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORSEM_TEST_REDIS_URL: redis://127.0.0.1:16390/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/worker/python/requirements*.lock
      - run: python -m pip install -r apps/worker/python/requirements-dev.lock
      - run: python -m pip install --require-hashes -r apps/worker/python/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e apps/worker/python
      - name: Check TypeScript applications and native Python worker
        run: npm run check
      - name: Build applications and Python wheel
        run: npm run build
