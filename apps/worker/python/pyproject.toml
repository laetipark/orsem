[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orsem-worker"
version = "0.2.0"
description = "Orsem ingestion and enrichment worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bullmq==2.26.0", "SQLAlchemy>=2.0,<2.1", "asyncmy>=0.2,<0.3",
  "httpx>=0.28,<0.29", "pydantic>=2,<3", "redis==7.4.0",
  "websockets>=15,<17", "pywebpush>=2,<3", "python-dotenv>=1,<2",
  "openpyxl==3.1.5",
  "lxml>=5,<7", "defusedxml>=0.7,<0.8", "charset-normalizer>=3,<4", "regex>=2024.11.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
orsem-worker = "orsem_worker.__main__:main"

[tool.setuptools.packages.find]
include = ["orsem_worker*"]

[tool.setuptools.package-data]
orsem_worker = ["**/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["orsem_worker"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
